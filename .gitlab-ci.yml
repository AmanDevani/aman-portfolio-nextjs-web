stages:
  - sync

.deploy_template:
  stage: deploy
  image: node:22
  before_script:
    - npm ci

sync_to_github:
  stage: sync
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  script:
    - echo "Starting synchronization with GitHub..."
    - apk add --no-cache git openssh-client
    - git checkout "${CI_COMMIT_REF_NAME}"
    - git pull
    - git remote add github https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/$GITHUB_ORG_NAME/$GITHUB_REPO_NAME.git
    - git push github "${CI_COMMIT_REF_NAME}"
